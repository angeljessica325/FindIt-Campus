
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FindIt Campus</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5eaff);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .card {
            width: 100%; max-width: 420px;
            background: white; padding: 32px;
            border-radius: 18px;
            box-shadow: 0 10px 40px #34205b18;
        }
        h1 { color: #5634a3; margin-bottom: 8px; }
        p { color: #666; line-height: 1.5; }
        label { display: block; margin: 16px 0 7px; font-weight: bold; }
        input {
            width: 100%; padding: 12px;
            border: 1px solid #ddd; border-radius: 9px;
            font-size: 15px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px;
            border: 0; border-radius: 9px;
            background: #6741b8; color: white;
            font-size: 16px; cursor: pointer;
        }
        #message { margin-top: 14px; overflow-wrap: anywhere; }
        a { color: #6741b8; }
        .back { display: inline-block; margin-bottom: 12px; }
    </style>
</head>
<body>
    <main class="card">
        <a class="back" href="/">← Back to Home</a>
        <h1>Welcome Back!</h1>
        <p>Login to your FindIt Campus account.</p>

        <form id="loginForm">
            <label for="email">College Email</label>
            <input id="email" name="email" type="email" required
                   autocomplete="username" placeholder="you@karunya.edu.in">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   required autocomplete="current-password"
                   placeholder="Enter your password">

            <button type="submit" id="submitBtn">Login</button>
        </form>

        <p id="message" role="status"></p>
        <p>New here? <a href="/register.html">Create an account</a></p>
    </main>

    <script src="/auth.js"></script>
</body>
</html>
