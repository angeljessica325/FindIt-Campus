
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | FindIt Campus</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #26213a;
            padding: 24px;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px #31205b10;
        }

        .avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #eee5ff;
            color: #6741b8;
            display: grid;
            place-items: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        h1 { color: #5634a3; }
        .field {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            overflow-wrap: anywhere;
        }

        .label {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value { font-weight: bold; }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        a, button {
            padding: 12px 17px;
            border-radius: 9px;
            border: none;
            background: #6741b8;
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .secondary { background: #eee8ff; color: #5634a3; }
        #message { color: #b42318; }
    </style>
</head>

<body>
    <main class="container">
        <a href="/" class="secondary">← Back to Home</a>

        <section class="card" style="margin-top:20px">
            <div class="avatar" id="avatar">?</div>
            <h1>My Profile</h1>
            <p>Your FindIt Campus account</p>

            <div class="field">
                <div class="label">Full Name</div>
                <div class="value" id="name">Loading...</div>
            </div>

            <div class="field">
                <div class="label">College Email</div>
                <div class="value" id="email">Loading...</div>
            </div>

            <p id="message" role="status"></p>

            <div class="links">
                <a href="/my-reports.html" class="secondary">
                    My Reports
                </a>
                <button id="logoutBtn">Logout</button>
            </div>
        </section>
    </main>

    <script>
        async function loadProfile() {
            try {
                const response = await fetch("/api/auth/me", {
                    credentials: "same-origin"
                });

                if (response.status === 401 ||
                    response.status === 403) {
                    window.location.href = "/login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Could not load your profile.");
                }

                const data = await response.json();
                const user = data.user || data.student || data;

                const name = user.name || user.student_name || "";
                const email = user.email || "";

                if (!name || !email) {
                    throw new Error(
                        "Profile fields do not match the API response."
                    );
                }

                document.getElementById("name").textContent = name;
                document.getElementById("email").textContent = email;
                document.getElementById("avatar").textContent =
                    name.charAt(0).toUpperCase();

            } catch (error) {
                document.getElementById("message").textContent =
                    error.message;
                document.getElementById("name").textContent = "Unavailable";
                document.getElementById("email").textContent = "Unavailable";
            }
        }

        document.getElementById("logoutBtn")
            .addEventListener("click", async () => {
                try {
                    const response = await fetch("/api/auth/logout", {
                        method: "POST",
                        credentials: "same-origin"
                    });

                    if (response.ok) {
                        window.location.href = "/";
                    } else {
                        alert("Logout failed.");
                    }
                } catch {
                    alert("Unable to connect to the server.");
                }
            });

        loadProfile();
    </script>
</body>
</html>
